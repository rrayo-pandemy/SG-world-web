# Despliegue gratuito de demostracion en Render.
# Crea ambos servicios desde el Dashboard: New > Blueprint y selecciona este repositorio.
services:
  - type: web
    name: ganesh-api-rrayo
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://ganesh-web-rrayo.onrender.com

  - type: web
    name: ganesh-web-rrayo
    runtime: static
    buildCommand: node frontend/scripts/generate-runtime-config.js
    staticPublishPath: frontend
    envVars:
      - key: API_BASE_URL
        value: https://ganesh-api-rrayo.onrender.com
